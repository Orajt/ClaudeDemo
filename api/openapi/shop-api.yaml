openapi: 3.0.3
info:
  title: Shop API (POC)
  version: 1.0.0
  description: |
    Kontrakt API POC „Shop”: zamówienia, rozliczenia z bramką DemoPay i widoki DataHub.
    Źródło prawdy dla generatora (contract-first). Właściciel: zespół – zmiany przez PR.

    Konwencje:
    - kwoty: `type: number` bez `format` (generator C# → `decimal`; `format: double` dałby `double`), waluta PLN,
    - błędy: `application/problem+json` z polem `code`,
    - wymagana rola opisana w `description` operacji (role realmu Keycloak: sales, accounting, gateway).
servers:
  - url: /
tags:
  - name: Orders
    description: Zamówienia i płatności (moduł zapisu)
  - name: Settlements
    description: Rozliczenia z bramką DemoPay (moduł zapisu)
  - name: DataHub
    description: Widoki do odczytu sklejone z modułów
security:
  - bearerAuth: []

paths:
  /api/orders:
    post:
      tags: [Orders]
      operationId: PlaceOrder
      summary: Złożenie zamówienia
      description: "Rola: sales."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Zamówienie złożone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPlacedResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/orders/{orderId}/payment-confirmation:
    post:
      tags: [Orders]
      operationId: ConfirmPayment
      summary: Potwierdzenie płatności (callback bramki DemoPay)
      description: "Rola: gateway. Ponowny callback z tym samym transactionId dla opłaconego zamówienia zwraca 204."
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
      responses:
        '204':
          description: Płatność potwierdzona
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolated'

  /api/orders/{orderId}/cancellation:
    post:
      tags: [Orders]
      operationId: CancelOrder
      summary: Anulowanie nieopłaconego zamówienia
      description: "Rola: sales."
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '204':
          description: Zamówienie anulowane
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolated'

  /api/orders/{orderId}/refund:
    post:
      tags: [Orders]
      operationId: RefundOrder
      summary: Zwrot całości kwoty opłaconego zamówienia
      description: "Rola: sales."
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundOrderRequest'
      responses:
        '204':
          description: Zwrot zarejestrowany
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolated'

  /api/settlement-reports:
    post:
      tags: [Settlements]
      operationId: ImportSettlementReport
      summary: Import raportu rozliczeniowego DemoPay (CSV)
      description: "Rola: accounting. Nazwa pliku identyfikuje raport – ponowny import tego samego pliku zwraca 409."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Plik CSV w formacie DemoPay (UTF-8, separator średnik)
      responses:
        '201':
          description: Raport zaimportowany i uzgodniony
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementReportImportedResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolated'

  /api/datahub/order-payments:
    get:
      tags: [DataHub]
      operationId: ListOrderPayments
      summary: Lista zamówień z informacją o płatności i rozliczeniu
      description: "Role: sales, accounting."
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderPaymentStatus'
        - name: search
          in: query
          required: false
          description: Fragment nazwy klienta, e-maila lub identyfikatora transakcji
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Strona wyników
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPaymentPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/datahub/order-payments/{orderId}:
    get:
      tags: [DataHub]
      operationId: GetOrderPayment
      summary: Szczegóły płatności i rozliczenia zamówienia
      description: "Role: sales, accounting."
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Widok zamówienia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPaymentView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/datahub/settlement-reports:
    get:
      tags: [DataHub]
      operationId: ListSettlementReports
      summary: Zaimportowane raporty rozliczeniowe (najnowsze pierwsze)
      description: "Rola: accounting."
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Strona wyników
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementReportPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/datahub/settlement-discrepancies:
    get:
      tags: [DataHub]
      operationId: ListSettlementDiscrepancies
      summary: Rozbieżności wykryte podczas uzgodnień
      description: "Rola: accounting."
      parameters:
        - name: reportId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DiscrepancyKind'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Strona wyników
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementDiscrepancyPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 25

  responses:
    ValidationFailed:
      description: Niepoprawne dane wejściowe
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Unauthorized:
      description: Brak lub niepoprawny token
    Forbidden:
      description: Brak wymaganej roli
    NotFound:
      description: Zasób nie istnieje
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Conflict:
      description: Konflikt współbieżności lub duplikat
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    BusinessRuleViolated:
      description: Naruszenie reguły biznesowej (pole code)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'

  schemas:
    ApiProblem:
      type: object
      description: Treść application/problem+json (RFC 9457) z polem code. Nazwa inna niż ProblemDetails, żeby nie kolidowała z Microsoft.AspNetCore.Mvc.ProblemDetails w kodzie generowanym.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Kod błędu, np. orders.payment-amount-mismatch
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    PlaceOrderRequest:
      type: object
      required: [customer, lines]
      properties:
        customer:
          $ref: '#/components/schemas/CustomerRequest'
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderLineRequest'

    CustomerRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 200

    OrderLineRequest:
      type: object
      required: [sku, productName, quantity, unitPrice]
      properties:
        sku:
          type: string
          maxLength: 50
        productName:
          type: string
          maxLength: 200
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
        unitPrice:
          type: number
          minimum: 0.01

    OrderPlacedResponse:
      type: object
      required: [orderId, totalAmount]
      properties:
        orderId:
          type: string
          format: uuid
        totalAmount:
          type: number

    ConfirmPaymentRequest:
      type: object
      required: [transactionId, amount, paidAt]
      properties:
        transactionId:
          type: string
          maxLength: 50
        amount:
          type: number
        paidAt:
          type: string
          format: date-time

    CancelOrderRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500

    RefundOrderRequest:
      type: object
      required: [refundTransactionId, reason, refundedAt]
      properties:
        refundTransactionId:
          type: string
          maxLength: 50
        reason:
          type: string
          maxLength: 500
        refundedAt:
          type: string
          format: date-time

    SettlementReportImportedResponse:
      type: object
      required: [reportId, lineCount, matchedCount, discrepancyCount]
      properties:
        reportId:
          type: string
          format: uuid
        lineCount:
          type: integer
          format: int32
        matchedCount:
          type: integer
          format: int32
        discrepancyCount:
          type: integer
          format: int32

    OrderPaymentStatus:
      type: string
      enum:
        - AwaitingPayment
        - PaidAwaitingSettlement
        - Settled
        - Refunded
        - RefundSettled
        - UnderReview
        - Cancelled

    SettlementStatus:
      type: string
      enum:
        - NotExpected
        - Expected
        - Settled
        - Discrepancy

    DiscrepancyKind:
      type: string
      enum:
        - InvalidLine
        - UnknownTransaction
        - AlreadySettled
        - TypeMismatch
        - AmountMismatch

    OrderPaymentView:
      type: object
      required: [orderId, paymentStatus, paymentSettlementStatus, refundSettlementStatus, discrepancyCount]
      properties:
        orderId:
          type: string
          format: uuid
        customerName:
          type: string
          nullable: true
        customerEmail:
          type: string
          nullable: true
        totalAmount:
          type: number
          nullable: true
        paymentStatus:
          $ref: '#/components/schemas/OrderPaymentStatus'
        placedAt:
          type: string
          format: date-time
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        paymentTransactionId:
          type: string
          nullable: true
        refundedAt:
          type: string
          format: date-time
          nullable: true
        refundTransactionId:
          type: string
          nullable: true
        paymentSettlementStatus:
          $ref: '#/components/schemas/SettlementStatus'
        refundSettlementStatus:
          $ref: '#/components/schemas/SettlementStatus'
        settledGrossAmount:
          type: number
          nullable: true
        settledFeeAmount:
          type: number
          nullable: true
        settledNetAmount:
          type: number
          nullable: true
        settlementDate:
          type: string
          format: date
          nullable: true
        settlementReportId:
          type: string
          format: uuid
          nullable: true
        discrepancyCount:
          type: integer
          format: int32
        lastDiscrepancyKind:
          allOf:
            - $ref: '#/components/schemas/DiscrepancyKind'
          nullable: true

    OrderPaymentPage:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderPaymentView'
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32

    SettlementReportView:
      type: object
      required: [reportId, fileName, settlementDate, importedAt, lineCount, matchedCount, discrepancyCount, totalGrossAmount, totalFeeAmount, totalNetAmount]
      properties:
        reportId:
          type: string
          format: uuid
        fileName:
          type: string
        settlementDate:
          type: string
          format: date
        importedAt:
          type: string
          format: date-time
        lineCount:
          type: integer
          format: int32
        matchedCount:
          type: integer
          format: int32
        discrepancyCount:
          type: integer
          format: int32
        totalGrossAmount:
          type: number
        totalFeeAmount:
          type: number
        totalNetAmount:
          type: number

    SettlementReportPage:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SettlementReportView'
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32

    SettlementDiscrepancyView:
      type: object
      required: [discrepancyId, reportId, transactionId, kind, detectedAt]
      properties:
        discrepancyId:
          type: string
          format: uuid
        reportId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
          nullable: true
        customerName:
          type: string
          nullable: true
        transactionId:
          type: string
        kind:
          $ref: '#/components/schemas/DiscrepancyKind'
        expectedAmount:
          type: number
          nullable: true
        reportedAmount:
          type: number
          nullable: true
        detectedAt:
          type: string
          format: date-time

    SettlementDiscrepancyPage:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SettlementDiscrepancyView'
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
